<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>予約の管理｜イタキモ</title>
<style>
:root { --paper:#fefdfa; --ink:#1a1a1a; --muted:#5c5c5c; --brand:#9b321f; --night:#2d2c28; --tint:#f3eae5; --line:#ebe9e4; --soft:#f8f6f1; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans JP",system-ui,sans-serif; font-size:15px; line-height:1.7; }
.wrap { max-width:720px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:20px; }
h1 { font-size:20px; margin:0; }
h2 { font-size:17px; margin:0 0 8px; border-bottom:1px solid var(--line); padding-bottom:4px; }
input, button { font:inherit; }
.login { display:flex; gap:8px; flex-wrap:wrap; }
.login input { flex:1 1 200px; padding:10px; border:1px solid var(--line); border-radius:4px; font-size:16px; }
.btn { border:1px solid var(--brand); background:var(--brand); color:#fff; border-radius:4px; padding:8px 16px; cursor:pointer; font-weight:700; }
.btn.ghost { background:#fff; color:var(--ink); border-color:var(--line); font-weight:400; }
.err { color:var(--brand); font-weight:700; }
.day { border:1px solid var(--line); border-radius:6px; background:#fff; margin-bottom:10px; }
.day > h3 { margin:0; font-size:15px; padding:8px 12px; background:var(--soft); border-bottom:1px solid var(--line); }
.bk { padding:10px 12px; border-top:1px solid var(--line); display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:14px; }
.bk:first-of-type { border-top:0; }
.bk .t { font-weight:700; font-size:16px; }
.bk .m { color:var(--muted); font-size:13px; }
.st { display:inline-block; font-size:11px; padding:0 6px; border-radius:3px; border:1px solid currentColor; margin-left:6px; }
.st.pend { color:#a26b00; }
.st.paid { color:#2f6b3a; }
.cal { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
.cal .wd { text-align:center; font-size:11px; color:var(--muted); }
.cal button { border:1px solid var(--line); background:#fff; border-radius:4px; min-height:54px; padding:4px 0; cursor:pointer; display:flex; flex-direction:column; align-items:center; font-size:12px; }
.cal button b { font-size:15px; }
.cal button.full { background:var(--brand); color:#fff; border-color:var(--brand); }
.cal button.night { background:var(--night); color:#fff; border-color:var(--night); }
.cal button.custom { outline:2px dashed var(--brand); outline-offset:-4px; }
.legend { font-size:12px; color:var(--muted); }
select { font:inherit; font-size:15px; padding:8px; border:1px solid var(--line); border-radius:4px; background:#fff; }
.cal button.off { opacity:.35; }
.cal button.off::after { content:"非公開"; font-size:9px; }
.pub { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:12px; display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.pub strong { font-size:16px; }
.pub .row { display:flex; flex-wrap:wrap; gap:8px; }
.vc { max-height:72vh; overflow:auto; border:1px solid var(--line); border-radius:6px; background:#fff; position:relative; -webkit-overflow-scrolling:touch; }
.vc-in { display:grid; position:relative; }
.vc-h { position:sticky; top:0; z-index:3; background:var(--soft); border-bottom:1px solid var(--line); text-align:center; font-size:12px; line-height:1.3; padding:4px 0; }
.vc-h b { display:block; font-size:14px; }
.vc-h.today { background:var(--brand); color:#fff; }
.vc-h.sat { color:#2a5d9f; } .vc-h.sun { color:var(--brand); } .vc-h.today.sat, .vc-h.today.sun { color:#fff; }
.vc-corner { position:sticky; top:0; left:0; z-index:4; background:var(--soft); border-bottom:1px solid var(--line); }
.vc-ax { position:sticky; left:0; z-index:2; background:#fff; border-right:1px solid var(--line); font-size:10px; color:var(--muted); }
.vc-ax span { position:absolute; right:3px; transform:translateY(-50%); }
.vc-ax span:first-child { transform:none; }
.vc-col { position:relative; border-left:1px solid var(--line); background:repeating-linear-gradient(135deg,#f1efea 0 6px,#e8e5df 6px 12px); }
.vc-line { position:absolute; left:0; right:0; border-top:1px solid #d6d2c9; z-index:1; }
.vc-tick { position:absolute; left:0; right:0; border-top:1px dotted #dcd8cf; z-index:1; pointer-events:none; }
.vc-open { position:absolute; left:0; right:0; background:#fff; }
.vc-open.off { background:#fbfaf7; }
.vc-ev { position:absolute; left:2px; right:2px; border-radius:4px; padding:2px 4px; font-size:11px; line-height:1.3; overflow:hidden; cursor:pointer; z-index:2; }
.vc-ev.vbk { background:var(--brand); color:#fff; }
.vc-ev.vbk.pend { background:#a26b00; }
.vc-ev.vbk.done { opacity:.55; }
.vc-ev.blk { background:#5c5c5c; color:#fff; }
.vc-ev.gap { background:repeating-linear-gradient(135deg,#f3eae5 0 4px,#fff 4px 8px); cursor:default; padding:0; }
.vc-ev b { display:block; font-size:12px; }
.vc-past { position:absolute; left:0; right:0; top:0; background:rgba(120,120,120,.18); pointer-events:none; z-index:3; }
.vc-now { position:absolute; left:0; right:0; border-top:2px solid var(--brand); z-index:3; pointer-events:none; }
.vc-leg { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted); margin-top:6px; }
.vc-leg i { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-2px; margin-right:4px; border:1px solid var(--line); }
.hl { animation:hl 2s; } @keyframes hl { 0%,40% { background:var(--tint); } }
.vc-col { cursor:copy; }
.sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:#fff; width:100%; max-width:520px; max-height:88vh; overflow:auto; border-radius:12px 12px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
@media (min-width:700px) { .sheet-bg { align-items:center; } .sheet { border-radius:12px; } }
.sheet h3 { margin:0; font-size:17px; display:flex; justify-content:space-between; align-items:center; }
.sheet h3 button { border:0; background:none; font-size:22px; cursor:pointer; line-height:1; }
.sheet label { display:flex; flex-direction:column; gap:2px; font-size:13px; color:var(--muted); }
.sheet label.ck { flex-direction:row; align-items:center; gap:6px; color:var(--ink); font-size:14px; }
.sheet input:not([type=checkbox]), .sheet textarea, .sheet select { font:inherit; font-size:16px; padding:8px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink); width:100%; }
.sheet .two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.sheet .tabs { display:flex; gap:6px; }
.sheet .tabs button { flex:1; padding:8px; border:1px solid var(--line); background:#fff; border-radius:4px; font:inherit; cursor:pointer; }
.sheet .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.sheet .acts { display:flex; flex-wrap:wrap; gap:6px; }
.sheet .info { background:var(--soft); border-radius:6px; padding:8px 10px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const hm = m => `${Math.floor(m/60)}:${pad(m%60)}`;
const WD = ["日","月","火","水","木","金","土"];
const fmt = s => { const d = new Date(s+"T00:00:00Z"); return `${d.getUTCMonth()+1}/${d.getUTCDate()}（${WD[d.getUTCDay()]}）`; };
const KIND = { closed:"休み", full:"通し", night:"夜" };
const NEXT = { closed:"full", full:"night", night:"closed" };
let pass = ""; try { pass = localStorage.getItem("itakimo-admin") || ""; } catch {}
let data = null, err = "";
// 売上
const METHODS = ["現金", "カード", "電子マネー", "QR決済（PayPayなど）", "事前決済", "お代なし（トライアルなど）"];
let salesYm = "", sales = null;
const yen = n => "¥" + Number(n || 0).toLocaleString("ja-JP");
function settleHtml(b, today) {
  if (b.status !== "confirmed") return "";
  if (b.settled_at) return `<span class="m" style="color:#2f6b3a;font-weight:700;">会計済み ${yen(b.paid_amount)}（${esc(b.paid_method || "")}）</span> <button class="btn ghost" data-unsettle="${esc(b.id)}">記録を取り消す</button>`;
  if (b.date > today) return "";
  const def = b.pay === "card" && b.paid_at ? "事前決済" : "現金";
  return `<span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
    <select id="sm-${esc(b.id)}">${METHODS.map(m => `<option${m === def ? " selected" : ""}>${m}</option>`).join("")}</select>
    <input id="sa-${esc(b.id)}" type="number" inputmode="numeric" min="0" step="100" value="${Number(b.total)}" style="width:96px;">円
    <button class="btn" data-settle="${esc(b.id)}">来店・会計を記録</button></span>`;
}
function sumTable(title, m) {
  const ks = Object.keys(m || {}).sort((a, b) => m[b].yen - m[a].yen);
  if (!ks.length) return "";
  return `<p class="legend" style="margin:10px 0 2px;"><b>${title}</b></p>` + ks.map(k => `<div class="m" style="display:flex;justify-content:space-between;max-width:420px;"><span>${esc(k)}</span><span>${m[k].n}件　${yen(m[k].yen)}</span></div>`).join("");
}
function salesSection() {
  if (!sales) return `<section><h2>売上</h2><p class="legend">読み込み中…</p></section>`;
  const s = sales.summary;
  const [y, mo] = sales.ym.split("-").map(Number);
  const rows = sales.rows.map(b => `<div class="bk"><span class="t">${+b.date.slice(8)}日 ${hm(+b.start_min)}</span>
      <span><b>${esc(b.name)}</b> 様　${b.course === "c90" ? "90分" : b.course === "c40" ? "40分" : "60分"}・${b.visit === "first" ? "はじめて" : "2回目以降"}　予約時 ${yen(b.total)}</span>
      <span></span>${settleHtml(b, sales.today) || `<span class="m">これからのご予約</span>`}</div>`).join("") || `<p class="legend">この月の予約はありません。</p>`;
  return `<section><h2>売上</h2>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;"><button class="btn ghost" data-ym="-1">前の月</button><b>${y}年${mo}月</b><button class="btn ghost" data-ym="1">次の月</button></div>
    <p style="font-size:18px;margin:4px 0;"><b>${yen(s.total)}</b>　<span class="m">${s.count}件${s.count ? `・客単価 ${yen(Math.round(s.total / s.count))}` : ""}</span></p>
    ${s.unrecorded ? `<p class="m" style="color:var(--brand);font-weight:700;">まだ会計を記録していない、過ぎた予約が ${s.unrecorded}件 あります</p>` : ""}
    <p class="m">早割などで値引きした合計：${yen(s.discount)}</p>
    ${sumTable("受け取り方法", s.byMethod)}${sumTable("コース", s.byCourse)}${sumTable("はじめて／2回目以降", s.byVisit)}${sumTable("経由", s.bySource)}
    <p style="margin:12px 0;"><button class="btn ghost" id="csv">この月のCSVを保存</button> <span class="m">会計を記録した分だけが入ります</span></p>
    ${rows}</section>`;
}
async function loadSales() {
  if (!salesYm) salesYm = (data && data.today || new Date().toISOString()).slice(0, 7);
  try { sales = await api("GET_SALES"); } catch (e) { sales = null; }
  render();
}

async function api(method, body) {
  if (method === "GET_SALES") {
    const r = await fetch("/api/yoyaku/admin?sales=" + salesYm, { headers:{ "x-admin-pass":pass }, cache:"no-store" });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "エラー");
    return j;
  }
  const r = await fetch("/api/yoyaku/admin", { method, headers:{ "x-admin-pass":pass, "Content-Type":"application/json" }, body: body ? JSON.stringify(body) : undefined, cache:"no-store" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const er = new Error(j.error || "エラー"); er.code = j.code; throw er; }
  return j;
}
async function load() {
  try { data = await api("GET"); err = ""; try { localStorage.setItem("itakimo-admin", pass); } catch {} }
  catch (e) { data = null; err = e.message; }
  render();
  if (data) loadSales();
}

function render() {
  const app = document.getElementById("app");
  if (!data) {
    app.innerHTML = `<h1>予約の管理</h1>
      <form class="login" id="lg"><input type="password" id="pw" placeholder="管理用パスワード" autocomplete="current-password" value="${esc(pass)}"><button class="btn">開く</button></form>
      ${err ? `<p class="err">${esc(err)}</p>` : ""}`;
    document.getElementById("lg").onsubmit = e => { e.preventDefault(); pass = document.getElementById("pw").value; load(); };
    return;
  }
  const byDate = {};
  for (const b of data.bookings) (byDate[b.date] ||= []).push(b);
  const dayHtml = d => `<div class="day"><h3>${fmt(d)}${d === data.today ? "　今日" : ""}</h3>${byDate[d].map(b => {
    const a = (() => { try { return JSON.parse(b.answers || "{}"); } catch { return {}; } })();
    const qa = [a.first && `足つぼ専門店は初めて：${a.first}`, a.hurt && `けが・痛み：${a.hurt}`, a.stay && `過ごし方：${a.stay}`].filter(Boolean).join("／");
    return `<div class="bk" id="bk-${esc(b.id)}">
      <span class="t">${hm(+b.start_min)}</span>
      <span><b>${esc(b.name)}</b> 様　${b.course === "c90" ? "90分" : b.course === "c40" ? "40分" : "60分"}・${b.visit === "first" ? "はじめて" : "2回目以降"}
        ${b.status === "pending" ? `<span class="st pend">決済待ち</span>` : b.pay === "card" ? `<span class="st paid">事前決済済み</span>` : `<span class="st">当日払い</span>`}</span>
      <span></span><span class="m">¥${Number(b.total).toLocaleString()}　${esc(b.tel || "")} ${esc(b.mail || "")}</span>
      ${qa ? `<span></span><span class="m">${esc(qa)}</span>` : ""}
      ${b.memo ? `<span></span><span class="m">メモ：${esc(b.memo)}</span>` : ""}
      ${b.visits ? `<span></span><span class="m" style="color:#2f6b3a;font-weight:700;">この方の過去の来店：${b.visits}回</span>` : ""}
      ${b.tel ? `<span></span><span class="m">お客様メモ（お客様には見えません）：<span style="white-space:pre-line;">${esc(b.note || "なし")}</span> <button class="btn ghost" data-note="${esc(b.tel)}">編集</button>
        <span id="ne-${esc(b.id)}" data-tel="${esc(b.tel)}" style="display:none;"><textarea rows="3" style="width:100%;">${esc(b.note || "")}</textarea><button class="btn" data-notesave="${esc(b.id)}">メモを保存</button></span></span>` : ""}
      ${b.source ? `<span></span><span class="m">経由：${esc(b.source)}</span>` : ""}
      ${b.cancels ? `<span></span><span class="m" style="color:var(--brand);font-weight:700;">この方の過去のキャンセル：${b.cancels}回</span>` : ""}
      ${settleHtml(b, data.today) ? `<span></span>${settleHtml(b, data.today)}` : ""}
      <span></span><span style="display:flex;gap:6px;flex-wrap:wrap;"><button class="btn ghost" data-cancel="${esc(b.id)}" data-mode="request" data-name="${esc(b.name)}" data-pay="${esc(b.pay || "")}" data-mail="${b.mail ? "1" : ""}">ご依頼でキャンセル</button><button class="btn ghost" data-cancel="${esc(b.id)}" data-mode="noshow" data-name="${esc(b.name)}">来店なしで取り消す</button><button class="btn ghost" data-block="${esc(b.id)}" data-name="${esc(b.name)}">以降お断り</button></span>
    </div>`; }).join("")}</div>`;
  const allDates = Object.keys(byDate).sort();
  const list = allDates.filter(d => d >= data.today).map(dayHtml).join("") || `<p class="legend">これからの予約はありません。</p>`;
  const pastDates = allDates.filter(d => d < data.today).reverse();
  const pastList = pastDates.length ? `<details><summary style="cursor:pointer;">過去7日の予約（${pastDates.reduce((n, d) => n + byDate[d].length, 0)}件・会計の記録用）</summary>${pastDates.map(dayHtml).join("")}</details>` : "";

  const times = []; for (let m = 6 * 60; m <= 23 * 60; m += 10) times.push(m);
  const first = new Date(data.days[0].date+"T00:00:00Z").getUTCDay();
  const cal = WD.map(w => `<div class="wd">${w}</div>`).join("") + "<div></div>".repeat(first) + data.days.map(d =>
    `<button type="button" class="${d.kind}${d.custom ? " custom" : ""}${data.published && d.date > data.published ? " off" : ""}" data-d="${d.date}" data-k="${d.kind}"><b>${+d.date.slice(8)}</b>${KIND[d.kind]}</button>`).join("");

  // 縦型カレンダー（日ごとの列・時間は縦）
  const PX = 0.9, GAPM = 15;
  const minS = Math.min(6 * 60 + 30, ...data.bookings.map(b => +b.start_min), ...(data.blocks || []).map(x => +x.start_min));
  const maxE = Math.max(23 * 60, ...data.bookings.map(b => +b.end_min + GAPM), ...(data.blocks || []).map(x => +x.end_min));
  const T0 = Math.floor(minS / 60) * 60, T1 = Math.ceil(maxE / 60) * 60, H = (T1 - T0) * PX, y = m => (m - T0) * PX;
  const nowD = new Date(Date.now() + 9 * 3600e3), nowM = nowD.getUTCHours() * 60 + nowD.getUTCMinutes();
  const HRS = { full: [9 * 60, 22 * 60 + 40], night: [21 * 60 + 10, 22 * 60 + 40] };
  let vax = "", vcols = "", vhead = "";
  for (let m = T0; m < T1; m += 60) vax += `<span style="top:${y(m)}px">${m / 60}:00</span>`;
  for (const d of data.days) {
    const w = new Date(d.date + "T00:00:00Z").getUTCDay();
    vhead += `<div class="vc-h${d.date === data.today ? " today" : ""}${w === 6 ? " sat" : w === 0 ? " sun" : ""}"><b>${+d.date.slice(5, 7)}/${+d.date.slice(8)}</b>${WD[w]}・${KIND[d.kind]}</div>`;
    let c = "";
    for (let m = T0 + 60; m < T1; m += 60) c += `<div class="vc-line" style="top:${y(m)}px"></div>`;
    if (HRS[d.kind]) c += `<div class="vc-open${data.published && d.date > data.published ? " off" : ""}" style="top:${y(6 * 60 + 30)}px;height:${150 * PX}px"></div>`; // 朝の枠
    if (HRS[d.kind]) { const [a, b] = HRS[d.kind]; c += `<div class="vc-open${data.published && d.date > data.published ? " off" : ""}" style="top:${y(a)}px;height:${(b - a) * PX}px"></div>`; }
    // 開始時刻の刻みの線（朝・夜は10分、通しは15分）。1時間ごとの線と重なるところは引かない
    if (HRS[d.kind]) {
      const ticks = [[6 * 60 + 30, 9 * 60, 10], d.kind === "full" ? [9 * 60, 22 * 60 + 40, 15] : [21 * 60 + 10, 22 * 60 + 40, 10]];
      for (const [a, b, st] of ticks) for (let m = a; m < b; m += st) if (m % 60) c += `<div class="vc-tick" style="top:${y(m)}px"></div>`;
    }
    for (const x of (data.blocks || []).filter(x => x.date === d.date))
      c += `<div class="vc-ev blk" data-vbl="${x.id}" style="top:${y(+x.start_min)}px;height:${(+x.end_min - +x.start_min) * PX}px"><b>ブロック</b>${hm(+x.start_min)}〜${hm(+x.end_min)} ${esc(x.note || "")}</div>`;
    for (const b of (byDate[d.date] || [])) {
      const s = +b.start_min, e = +b.end_min;
      c += `<div class="vc-ev gap" style="top:${y(e)}px;height:${GAPM * PX}px"></div>`;
      c += `<div class="vc-ev vbk${b.status === "pending" ? " pend" : ""}${d.date === data.today && e <= nowM ? " done" : ""}" data-vb="${esc(b.id)}" style="top:${y(s)}px;height:${(e - s) * PX}px"><b>${hm(s)} ${esc(b.name)}</b>${b.course === "c90" ? "90分" : b.course === "c40" ? "40分" : "60分"}・${b.visit === "first" ? "初" : "2回目〜"}${b.status === "pending" ? "・決済待ち" : b.pay === "card" ? "・済" : ""}</div>`;
    }
    if (d.date === data.today && nowM > T0) c += `<div class="vc-past" style="height:${Math.min(H, y(nowM))}px"></div>${nowM < T1 ? `<div class="vc-now" style="top:${y(nowM)}px"></div>` : ""}`;
    vcols += `<div class="vc-col" data-vd="${d.date}" style="height:${H}px">${c}</div>`;
  }
  const vcal = `<div class="vc" id="vc"><div class="vc-in" style="grid-template-columns:40px repeat(${data.days.length}, minmax(92px, 31vw));">
    <div class="vc-corner"></div>${vhead}<div class="vc-ax" style="height:${H}px;">${vax}</div>${vcols}</div></div>

    const req = b.dataset.mode === "request";
    const msg = req
      ? `${b.dataset.name} 様のご依頼で、予約をキャンセルします。\n` + (b.dataset.mail ? "・お客様にキャンセルのメールを送ります\n" : "・メールアドレスがないため、お知らせは送られません（DMや電話でお伝えください）\n") + (b.dataset.pay === "card" ? "・事前決済の分は全額返金します\n" : "") + "よろしいですか？"
      : `${b.dataset.name} 様の予約を「来店なし」として取り消します。\n・お客様への連絡と返金はしません\nよろしいですか？`;
    if (!confirm(msg)) return;
    try {
      const j = await api("POST", { cancel:b.dataset.cancel, mode:b.dataset.mode });
      if (j && j.refundFailed) alert("返金がうまくいきませんでした。Stripeの画面から返金してください。");
      else if (j && j.refunded) alert(`¥${Number(j.refunded).toLocaleString("ja-JP")} を返金しました。`);
    } catch (e) { alert(e.message); }
    load();
  });
}
pass ? load() : render();
})();
</script>
</body>
</html>
