<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ご予約｜足つぼ専門店 イタキモ</title>
<link rel="icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap">
<style>
:root {
  --paper:#fefdfa; --raised:#ffffff; --ink:#1a1a1a; --muted:#5c5c5c; --sub:#3d3a34;
  --brand:#9b321f; --night:#2d2c28; --tint:#f3eae5; --line:#ebe9e4; --soft:#f8f6f1;
  --mincho:"Shippori Mincho",serif; --sans:"Noto Sans JP",system-ui,sans-serif; --num:"Cormorant Garamond","Shippori Mincho",serif;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.8; letter-spacing:.03em; padding-bottom:110px; -webkit-font-smoothing:antialiased; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.demo { background:var(--night); color:var(--paper); font-size:11px; text-align:center; padding:6px 12px; padding-top:calc(6px + env(safe-area-inset-top,0px)); }
.wrap { max-width:560px; margin:0 auto; padding:20px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:24px; }
.top { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:12px; }
.logoimg { display:block; height:52px; width:auto; }
.logo { line-height:1.15; }
.logo small { display:block; font-family:var(--mincho); font-size:11px; letter-spacing:.12em; color:var(--night); }
.logo b { font-family:var(--mincho); font-weight:700; font-size:24px; letter-spacing:.14em; color:var(--brand); }
.badge { font-size:12px; color:var(--brand); border:1px solid var(--brand); padding:2px 8px; border-radius:3px; }
h2 { font-family:var(--mincho); font-weight:500; font-size:22px; letter-spacing:.06em; margin:0; }
h3 { font-family:var(--mincho); font-weight:500; font-size:18px; margin:0; }
.lead { margin:-14px 0 0; font-size:13px; color:var(--muted); }

/* ルール */
.rules { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:16px; }
.rules h2 { font-size:17px; margin-bottom:10px; }
.rules ol { list-style:none; margin:0; padding:0; counter-reset:r; }
.rules li { counter-increment:r; display:grid; grid-template-columns:28px 1fr; gap:0 8px; padding:10px 0; border-top:1px solid var(--line); }
.rules li::before { content:counter(r,decimal-leading-zero); font-family:var(--num); font-size:19px; line-height:1.4; color:var(--brand); }
.rules strong { display:block; font-size:14px; }
.rules span { overflow-wrap:anywhere; display:block; font-size:12px; color:var(--sub); line-height:1.7; }
.rules .more { margin:8px 0 0; font-size:12px; color:var(--muted); }

/* ステップ */
.steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:4px; }
.steps span { font-size:11px; text-align:center; padding:6px 2px 4px; border-bottom:2px solid var(--line); color:var(--muted); }
.steps span.on { border-color:var(--brand); color:var(--ink); font-weight:700; }
.steps span.done { border-color:var(--ink); color:var(--ink); }

.seg { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--raised); }
.seg button { appearance:none; border:0; background:none; font:inherit; font-size:14px; font-weight:500; padding:12px 8px; cursor:pointer; color:var(--ink); }
.seg button+button { border-left:1px solid var(--line); }
.seg button[aria-pressed="true"] { background:var(--night); color:var(--paper); font-weight:700; }
.visit { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
.visit button { appearance:none; display:flex; align-items:center; justify-content:center; gap:10px; min-height:64px; padding:12px 8px; border:1.5px solid var(--line); border-radius:6px; background:var(--raised); color:var(--ink); font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
.visit.wait button { border-color:var(--brand); }
.visit button i { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--brand); flex:none; position:relative; background:#fff; }
.visit button[aria-checked="true"] { background:var(--tint); border-color:var(--brand); }
.visit button[aria-checked="true"] i::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--brand); }
.visit.wait { animation:nudge 2.4s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform:none; } 50% { transform:translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .visit.wait { animation:none; } }
.label { font-size:13px; font-weight:700; margin:-12px 0 -14px; }

.opts { display:flex; flex-direction:column; gap:8px; }
.opt { display:flex; gap:10px; align-items:flex-start; background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:12px 14px; cursor:pointer; }
.opt:has(input:checked) { border-color:var(--brand); background:var(--tint); }
.opt input { appearance:none; -webkit-appearance:none; width:18px; height:18px; flex:none; margin:3px 0 0; border-radius:50%; border:1.5px solid var(--brand); background:#fff; position:relative; cursor:pointer; }
.opt input:checked::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--brand); }
.opt { border-width:1.5px; }
.opt strong { font-size:14px; }
.opt small { display:block; font-size:12px; color:var(--muted); line-height:1.6; }

.course { appearance:none; width:100%; text-align:left; cursor:pointer; display:flex; flex-wrap:wrap; column-gap:12px; row-gap:6px; gap:12px; align-items:center; background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:16px; font:inherit; color:var(--ink); }
.course { border-width:1.5px; }
.courses.wait .course { border-color:var(--brand); }
.courses.wait { animation:nudge 2.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .courses.wait { animation:none; } }
.course .rd { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--brand); position:relative; background:#fff; }
.course[aria-checked="true"] { background:var(--tint); border-color:var(--brand); }
.course[aria-checked="true"] .rd::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--brand); }
.course .rd { flex:none; }
.course .desc { flex:1 1 110px; min-width:0; }
.course .price { margin-left:auto; }
.course .min { flex:none; font-family:var(--num); font-size:32px; font-weight:600; line-height:1; }
.course .min small { font-family:var(--sans); font-size:12px; }
.course .desc { font-size:12px; color:var(--muted); }
.course .desc strong { display:block; font-size:15px; color:var(--ink); }
.lbl { display:table; margin:2px 0 4px; font-size:10px; font-weight:500; color:var(--brand); border:1px solid var(--brand); border-radius:2px; padding:0 6px; }
.lbl.hot { background:var(--brand); color:#fff; }
.tag { display:inline-block; margin-top:4px; font-size:11px; font-weight:700; color:var(--brand); border:1px solid var(--brand); border-radius:3px; padding:0 6px; }
.course .price { text-align:right; }
.course .price b { font-family:var(--num); font-size:24px; font-weight:600; }
.course .price small { display:block; font-size:11px; color:var(--muted); }

.box { border:1px solid var(--brand); border-radius:6px; padding:14px 16px; background:var(--raised); font-size:13px; }
.box h3 { font-size:16px; }
.box .sub { color:var(--brand); font-weight:700; }
.note { font-size:13px; color:var(--sub); background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin:0; }

/* 早割表 */
.eb { width:100%; border-collapse:collapse; font-size:13px; background:var(--raised); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.eb th, .eb td { padding:8px 10px; white-space:normal; border-bottom:1px solid var(--line); text-align:left; }
.eb td:last-child { text-align:right; font-weight:700; color:var(--brand); }
.eb caption { text-align:left; font-size:13px; font-weight:700; padding-bottom:6px; }

/* カレンダー */
.cal { background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:14px; }
.cal-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--line); }
.cal-head strong { font-family:var(--mincho); font-weight:500; font-size:18px; }
.cal-head button { appearance:none; border:1px solid var(--line); background:var(--paper); border-radius:3px; padding:4px 12px; font:inherit; font-size:12px; cursor:pointer; }
.cal-head button:disabled { opacity:.35; cursor:default; }
.grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; text-align:center; }
.wd { font-size:11px; color:var(--muted); }
.wd.sun { color:var(--brand); }
.day { appearance:none; border:1px solid var(--line); background:var(--raised); border-radius:3px; min-height:56px; padding:5px 1px 3px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; font:inherit; color:var(--ink); }
.day:disabled { background:var(--paper); opacity:.35; cursor:default; }
.day[aria-pressed="true"] { background:var(--night); color:var(--paper); border-color:var(--night); }
.day .n { font-family:var(--num); font-size:17px; font-weight:600; line-height:1.1; }
.day .s { font-size:11px; font-weight:700; line-height:13px; height:13px; }
.day .o { font-size:9px; font-weight:700; color:var(--brand); line-height:11px; height:11px; letter-spacing:-.02em; }
.day[aria-pressed="true"] .o { color:var(--paper); }
.nt { display:inline-block; background:var(--night); color:var(--paper); font-size:9px; padding:0 3px; border-radius:2px; }
.day[aria-pressed="true"] .nt { background:var(--paper); color:var(--night); }
.legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:var(--muted); margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
.legend b { color:var(--brand); }
.slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:8px; }
.slot { appearance:none; border:1px solid var(--line); background:var(--raised); border-radius:3px; padding:10px 4px; font-family:var(--num); font-size:17px; font-weight:600; cursor:pointer; color:var(--ink); }
.slot[aria-pressed="true"] { background:var(--brand); color:#fff; border-color:var(--brand); }
.slot:disabled { opacity:.4; text-decoration:line-through; cursor:default; background:var(--paper); }
.night { background:var(--night); color:var(--paper); border-radius:6px; padding:12px 14px; font-size:13px; }
.night strong { display:block; font-family:var(--mincho); font-weight:500; font-size:17px; }

/* 確認・フォーム */
.sheet { background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:16px; display:flex; flex-direction:column; gap:8px; }
.row { display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 12px; font-size:14px; }
.row span:last-child { margin-left:auto; }
.row span:first-child { color:var(--muted); flex:none; }
.row span:last-child { text-align:right; }
.row.minus span:last-child { color:var(--brand); font-weight:700; }
.row.total { border-top:1px solid var(--line); padding-top:10px; margin-top:4px; font-size:17px; font-weight:700; }
.row.total span:first-child { color:var(--ink); }
.capnote { font-size:11px; color:var(--muted); margin:-4px 0 0; text-align:right; }
.form { display:flex; flex-direction:column; gap:14px; }
.field { display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:500; }
.field input, .field textarea { font:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:3px; background:var(--raised); color:var(--ink); }
.field textarea { min-height:72px; resize:vertical; }
.qbox { border:1px solid var(--line); border-radius:6px; background:var(--soft); padding:16px; display:flex; flex-direction:column; gap:16px; }
.qbox > p { margin:0; font-size:13px; color:var(--sub); }
.q { display:flex; flex-direction:column; gap:6px; }
.q > span { font-size:13px; font-weight:700; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { appearance:none; border:1px solid var(--line); background:var(--raised); color:var(--ink); border-radius:999px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; }
.chip[aria-pressed="true"] { background:var(--night); color:var(--paper); border-color:var(--night); }
.reread summary { cursor:pointer; font-size:13px; color:var(--brand); padding:4px 0; }
.reread .rules { margin-top:8px; }
.check { display:flex; gap:8px; align-items:flex-start; font-size:13px; cursor:pointer; }
.check input { accent-color:var(--brand); margin-top:5px; }
.err { color:var(--brand); font-size:13px; font-weight:700; border:1px solid var(--brand); background:var(--tint); padding:8px 12px; border-radius:3px; }

/* Stripe画面の見本 */
.stripe { border:1px dashed var(--muted); border-radius:6px; padding:16px; background:#fff; display:flex; flex-direction:column; gap:10px; font-size:13px; }
.stripe .t { font-size:11px; color:var(--muted); }
.stripe .m { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stripe .m div { border:1px solid var(--line); border-radius:4px; padding:10px; text-align:center; font-weight:700; }

.bar { position:fixed; left:0; right:0; bottom:0; background:var(--raised); border-top:1px solid var(--line); padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); z-index:10; }
.bar-in { max-width:560px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px 10px; }
.sum { flex:1 1 140px; }
.sum { flex:1; min-width:0; font-size:12px; color:var(--muted); line-height:1.35; }
.sum b { display:block; font-family:var(--num); font-size:22px; color:var(--ink); }
.btn { appearance:none; border:1px solid var(--brand); background:var(--brand); color:#fff; font:inherit; font-size:14px; font-weight:700; padding:11px 20px; border-radius:3px; cursor:pointer; white-space:nowrap; letter-spacing:.08em; }
.btn:disabled { background:var(--line); border-color:var(--line); color:var(--muted); cursor:default; }
.btn.ghost { background:var(--raised); color:var(--ink); border-color:var(--line); font-weight:500; }

.agree { display:flex; gap:12px; align-items:flex-start; cursor:pointer; border:1.5px solid var(--brand); background:var(--tint); border-radius:6px; padding:14px 16px; font-size:15px; font-weight:700; }
.agree input { appearance:none; -webkit-appearance:none; flex:none; width:24px; height:24px; margin:1px 0 0; border:2px solid var(--brand); border-radius:4px; background:#fff; position:relative; cursor:pointer; }
.agree input:checked { background:var(--brand); }
.agree input:checked::after { content:""; position:absolute; left:7px; top:2px; width:6px; height:12px; border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg); }
.agree small { display:block; font-size:12px; font-weight:400; color:var(--sub); }
.okbox { display:flex; gap:14px; align-items:center; background:var(--night); color:var(--paper); border-radius:6px; padding:18px 16px; }
.okbox .mark { flex:none; width:44px; height:44px; border-radius:50%; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; }
.okbox strong { display:block; font-family:var(--mincho); font-weight:700; font-size:21px; letter-spacing:.06em; }
.okbox small { display:block; font-size:13px; opacity:.9; line-height:1.6; }
.okbox.wait .mark { background:var(--muted); }
</style>
</head>
<body>
<div class="demo" id="testbar" hidden>テスト環境です。お金は動きません（Stripeのテストカードを使います）。</div>
<div id="app"></div>
<script>if (location.hostname !== "www.itakimo.net" && location.hostname !== "itakimo.net") document.getElementById("testbar").hidden = false;</script>
<script src="/yoyaku/app.js?v=3"></script>
</body>
</html>
